<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tofu demo</title>
<style>
:root{--bg:#fbf9f8;--ink:#241f21;--mute:#6a6064;--accent:#b0306a;--line:#e6dfe2}
@media (prefers-color-scheme:dark){:root{--bg:#1c1819;--ink:#f1eaed;--mute:#a79ba0;--accent:#e06aa0;--line:#3a3135}}
html,body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:34rem;margin:0 auto;padding:12vh 16px 48px}
h1{font-size:1.6rem;margin:0 0 .4rem}
p{margin:.6rem 0}
.mute{color:var(--mute);font-size:.95rem}
a.btn{display:inline-block;margin-top:1rem;padding:.7rem 1.1rem;border-radius:12px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600}
.lang{margin-top:2rem;border-top:1px solid var(--line);padding-top:.8rem;font-size:.95rem}
.lang a{color:var(--accent)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1 id="title"></h1>
  <p id="lead"></p>
  <p id="note" class="mute"></p>
  <a id="go" class="btn" hidden></a>
  <p class="lang"><a id="other" href="#"></a></p>
</main>
<script>
// Launch page for the Tofu demo. Self-contained: no third-party requests, no learner data, nothing stored.
// Publish as its own public repository (no Tofu code). While LIVE is false it only says the demo is launching soon.
// When the demo is live (Furkan's explicit step), set LIVE to true: the page then checks that tofu.kutie.workers.dev is reachable
// (some networks, for example eduroam, block *.workers.dev) and forwards to /demo with the same ?lang.
var LIVE = false
var TARGET = 'https://tofu.kutie.workers.dev'
var TEXT = {
  en: {
    title: 'Tofu demo',
    soon: 'The demo is launching soon. Tofu is an adaptive TOEFL iBT prep app. The demo will open in your browser without a sign-in; its optional live writing check will send the text you choose to submit to a language model. Details will be on this page at launch. Please check back.',
    soonNote: 'This page keeps the same address, so a saved link will start working once the demo is live.',
    opening: 'Opening the demo…',
    blocked: 'Your network seems to block tofu.kutie.workers.dev (this happens on some university and company networks). Try another network, or your phone’s mobile data.',
    go: 'Open the demo',
    other: 'Türkçe'
  },
  tr: {
    title: 'Tofu demosu',
    soon: 'Demo yak\u0131nda yay\u0131nda. Tofu, uyarlanabilir bir TOEFL iBT haz\u0131rl\u0131k uygulamas\u0131d\u0131r. Demo giri\u015f gerektirmeden taray\u0131c\u0131n\u0131zda a\u00e7\u0131lacak; iste\u011fe ba\u011fl\u0131 canl\u0131 yazma denemesi, g\u00f6ndermeyi se\u00e7ti\u011finiz metni bir dil modeline iletecek. Ayr\u0131nt\u0131lar yay\u0131n s\u0131ras\u0131nda bu sayfada olacak. L\u00fctfen daha sonra tekrar bak\u0131n.',
    soonNote: 'Bu sayfanın adresi değişmez; kaydettiğiniz bağlantı demo yayınlanınca çalışmaya başlar.',
    opening: 'Demo açılıyor…',
    blocked: 'Ağınız tofu.kutie.workers.dev adresini engelliyor gibi görünüyor (bazı üniversite ve şirket ağlarında olur). Başka bir ağı ya da telefonunuzun mobil verisini deneyin.',
    go: 'Demoyu aç',
    other: 'English'
  }
}
function pick() {
  var q = new URLSearchParams(location.search).get('lang')
  if (q === 'tr' || q === 'en') return q
  return (navigator.language || 'en').slice(0, 2).toLowerCase() === 'tr' ? 'tr' : 'en'
}
var lang = pick()
var t = TEXT[lang]
document.documentElement.lang = lang
document.title = t.title
document.getElementById('title').textContent = t.title
var otherLang = lang === 'tr' ? 'en' : 'tr'
var other = document.getElementById('other')
other.textContent = TEXT[otherLang].other
other.href = '?lang=' + otherLang
var lead = document.getElementById('lead')
var note = document.getElementById('note')
var go = document.getElementById('go')
var demoUrl = TARGET + '/demo?lang=' + lang
if (!LIVE) {
  lead.textContent = t.soon
  note.textContent = t.soonNote
} else {
  lead.textContent = t.opening
  go.textContent = t.go
  go.href = demoUrl
  var done = false
  var timer = setTimeout(function () { if (!done) { done = true; lead.textContent = t.blocked; go.hidden = false } }, 6000)
  fetch(TARGET + '/manifest.webmanifest', { mode: 'no-cors', cache: 'no-store' }).then(function () {
    if (done) return
    done = true
    clearTimeout(timer)
    location.replace(demoUrl)
  }).catch(function () {
    if (done) return
    done = true
    clearTimeout(timer)
    lead.textContent = t.blocked
    go.hidden = false
  })
}
</script>
</body>
</html>
